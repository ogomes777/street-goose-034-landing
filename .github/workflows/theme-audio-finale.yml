name: Street Goose - Light Theme, Sound Dock & Finale

on:
  pull_request:
    branches: [main]
    paths:
      - "js/theme-audio-finale-polish.css"
      - "js/install-app.js"
      - "js/final-act-scene.js"
      - "js/final-act-motion.js"
      - "js/webgl-director.js"
      - "src/main.tsx"
      - "tests/launch/theme-audio-finale.spec.ts"
      - ".github/workflows/theme-audio-finale.yml"
  push:
    branches: [main]
    paths:
      - "js/theme-audio-finale-polish.css"
      - "js/install-app.js"
      - "js/final-act-scene.js"
      - "js/final-act-motion.js"
      - "js/webgl-director.js"
      - "src/main.tsx"
      - "tests/launch/theme-audio-finale.spec.ts"
      - ".github/workflows/theme-audio-finale.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: street-theme-finale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-and-desktop:
    name: Themes, player and animation | WebKit + Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Build, types and Content Security Policy
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Simulate iPhone Safari, Android and desktop Chrome
        run: npx playwright test tests/launch/theme-audio-finale.spec.ts --config=playwright.optical.config.ts --workers=1
