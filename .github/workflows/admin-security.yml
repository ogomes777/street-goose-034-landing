name: SG034 | Admin Security

on:
  pull_request:
    branches: [main]
    paths:
      - "js/admin-page.js"
      - "js/admin-mfa-gate.js"
      - "js/admin-mfa-gate.css"
      - "src/services/AdminService.ts"
      - "supabase/migrations/*admin_mfa*"
      - ".github/workflows/admin-security.yml"
      - "scripts/check-security-baseline.mjs"
      - "vercel.json"
      - "src/lib/supabase.ts"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sg-admin-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: TypeScript + Vite production build
        run: npm run build
      - name: Unit tests
        run: npm test -- --run
      - name: Verify security release invariants
        run: node scripts/check-security-baseline.mjs
      - name: Check production dependencies for high-risk advisories
        run: npm audit --omit=dev --audit-level=high
