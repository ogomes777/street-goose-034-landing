name: Street Goose - smoke SEO e mobile

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar site para validar HTML SEO
        run: npm run build
      - name: Auditar pesos de MP3, videos e imagens
        run: node scripts/audit-mobile-media.mjs
      - name: Instalar Chromium e WebKit para testes mobile
        run: npx playwright install --with-deps chromium webkit
      - name: Executar testes Android (Chromium) e iPhone (WebKit simulados)
        run: npx playwright test --config=playwright.launch.config.ts
