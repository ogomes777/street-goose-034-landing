name: Street Goose | Lighthouse production SEO + Core Web Vitals
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lighthouse-production.yml"
      - "scripts/report-lighthouse.mjs"
      - "tests/launch/seo-indexation.spec.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/lighthouse-production.yml"
      - "scripts/report-lighthouse.mjs"
      - "scripts/vite-seo-pages.ts"
      - "js/router.js"
      - "js/category-page.js"
      - "js/hero.js"
      - "js/scroll-film.js"
      - "src/main.tsx"
      - "index.html"
      - "styles.css"
      - "vite.config.ts"
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * 1"

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Chrome headless
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: Esperar a Vercel publicar este commit no dominio canonico
        if: github.event_name == 'push'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            live="$(curl -fLsS --max-time 20 --retry 1 'https://www.streetgoose034.com.br/' || true)"
            if printf '%s' "$live" | grep -Fq "name=\"sg-deploy-commit\" content=\"$EXPECTED_COMMIT\""; then
              echo "Producao conferida: commit $EXPECTED_COMMIT"
              exit 0
            fi
            echo "Deploy ainda em propagacao ($attempt/48)"
            sleep 10
          done
          echo "A versao esperada nao esta no dominio; abortando auditoria para evitar metricas falsas."
          exit 1
      - name: Auditar performance e SEO no dominio em producao
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          # Lighthouse tracing may sporadically fail NO_NAVSTART on shared CI
          # Chrome hosts. Retry the run without reporting a false site outage.
          audit() {
            local name="$1" url="$2" preset="$3"
            for attempt in 1 2 3; do
              echo "Lighthouse ${name} attempt ${attempt}/3"
              if npx --yes --package=lighthouse@12.8.2 lighthouse "$url" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" $preset --only-categories=performance,seo --throttling-method=simulate --output=json --output-path="lighthouse-reports/${name}.json" --max-wait-for-load=60000 --quiet; then
                return 0
              fi
              echo "Lighthouse trace failed. Retrying after cooldown."
              sleep 6
            done
            return 1
          }
          audit home-mobile "https://www.streetgoose034.com.br/" ""
          audit category-mobile "https://www.streetgoose034.com.br/categoria/lupas" ""
          audit home-desktop "https://www.streetgoose034.com.br/" "--preset=desktop"
      - name: Resumir indicadores e maiores recursos de rede
        if: always()
        run: node scripts/report-lighthouse.mjs lighthouse-reports
      - name: Publicar relatorios como artefatos do workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streetgoose-lighthouse-reports
          path: lighthouse-reports/*.json
          retention-days: 30
          if-no-files-found: warn
